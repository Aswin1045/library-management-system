<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <span>📚</span> Library Management System
        </a>
        <div class="navbar-links">
            <a th:href="@{/librarian/home}">Dashboard</a>
            <a th:href="@{/librarian/books}">Manage Books</a>
            <a th:href="@{/librarian/students}">Students</a>
            <a th:href="@{/librarian/borrow-records}">Borrow Records</a>
            <a th:href="@{/librarian/logout}" class="btn-nav">Logout</a>
        </div>
    </nav>

    <div class="container-sm mt-4">
        <div class="card">
            <div class="card-header text-center">
                <h2>✏️ Edit Book</h2>
                <p>Update book information</p>
            </div>

            <form th:action="@{/librarian/books/edit/{id}(id=${book.id})}" method="post" th:object="${book}">
                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input type="text" id="title" class="form-control" th:field="*{title}" required>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" class="form-control" th:field="*{author}" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" class="form-control" th:field="*{category}" required>
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" class="form-control" th:field="*{isbn}" required>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" class="form-control" th:field="*{quantity}" min="1" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Update Book</button>
            </form>

            <p class="text-center mt-2">
                <a th:href="@{/librarian/books}">← Back to Manage Books</a>
            </p>
        </div>
    </div>

    <div class="footer">
        <p>Library Management System &copy; 2025 | OOAD Lab Project</p>
    </div>

</body>
</html>
