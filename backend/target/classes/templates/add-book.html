<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container-sm mt-4">
        <div class="card">
            <div class="card-header text-center">
                <h2>➕ Add New Book</h2>
                <p>Add a book to the library collection</p>
            </div>

            <form th:action="@{/librarian/books/add}" method="post" th:object="${book}">
                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input type="text" id="title" class="form-control" th:field="*{title}" placeholder="Enter book title" required>
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" class="form-control" th:field="*{author}" placeholder="Enter author name" required>
                    <div th:if="${#fields.hasErrors('author')}" th:errors="*{author}" class="text-danger" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" class="form-control" th:field="*{category}" placeholder="e.g. Programming, Database, Networking" required>
                    <div th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-danger" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" class="form-control" th:field="*{isbn}" placeholder="Enter ISBN number" required>
                    <div th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}" class="text-danger" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" class="form-control" th:field="*{quantity}" placeholder="Enter quantity" min="1" required>
                    <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="text-danger" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Add Book</button>
            </form>

            <p class="text-center mt-2">
                <a th:href="@{/librarian/books}">← Back to Manage Books</a>
            </p>
        </div>
    </div>

    <div class="footer">
        <p>Library Management System &copy; 2025 | OOAD Lab Project</p>
    </div>

</body>
</html>
