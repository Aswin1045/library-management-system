<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container-sm mt-4">
        <div class="card">
            <div class="card-header text-center">
                <h2>🎓 Student Login</h2>
                <p>Login to borrow and manage your books</p>
            </div>

            <!-- Success Alert -->
            <div th:if="${success}" class="alert alert-success">
                <span>✅</span> <span th:text="${success}"></span>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger">
                <span>⚠️</span> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/student/login}" method="post">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
            </form>

            <p class="text-center mt-2">
                Don't have an account? <a th:href="@{/register}">Register here</a>
            </p>
        </div>
    </div>

    <div class="footer">
        <p>Library Management System &copy; 2025 | OOAD Lab Project</p>
    </div>

</body>
</html>
