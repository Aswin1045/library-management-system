<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container mt-4">
        <div class="page-header">
            <h2 class="serif">My Profile</h2>
            <a th:href="@{/student/home}" class="btn btn-outline btn-sm">Back to Dashboard</a>
        </div>

        <div class="card mb-4">
            <h3 class="serif mb-2">Student Information</h3>
            <p><strong>Name:</strong> <span th:text="${student.name}">Name</span></p>
            <p><strong>Email:</strong> <span th:text="${student.email}">Email</span></p>
            <p><strong>Department:</strong> <span th:text="${student.department}">Department</span></p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" th:text="${totalBorrowed}">0</div>
                <div class="stat-label">Total Books Borrowed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="${activeLoans}">0</div>
                <div class="stat-label">Active Loans</div>
            </div>
        </div>

        <div class="mt-4 text-center">
            <a th:href="@{/student/borrowed-books}" class="btn btn-primary">View Borrowing History</a>
        </div>
    </div>

    <div class="footer">
        <p>Library Management System &copy; 2026</p>
    </div>

</body>
</html>
