<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Login - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container-sm mt-4">
        <div class="card">
            <div class="card-header text-center">
                <h2>🔐 Librarian Login</h2>
                <p>Access the librarian dashboard</p>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger">
                <span>⚠️</span> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/librarian/login}" method="post" autocomplete="off">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" th:value="${enteredUsername}" class="form-control" placeholder="Enter username" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <p>Library Management System &copy; 2025 | OOAD Lab Project</p>
    </div>

</body>
</html>
