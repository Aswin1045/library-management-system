<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container">
        <div class="page-header">
            <h2>📚 Manage Books</h2>
            <a th:href="@{/librarian/books/add}" class="btn btn-primary">➕ Add New Book</a>
        </div>

        <!-- Success/Error Alerts -->
        <div th:if="${success}" class="alert alert-success">
            <span>✅</span> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <span>⚠️</span> <span th:text="${error}"></span>
        </div>

        <!-- Books Table -->
        <div th:if="${#lists.size(books) > 0}" class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>ISBN</th>
                        <th>Quantity</th>
                        <th>Available</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}">1</td>
                        <td th:text="${book.title}">Book Title</td>
                        <td th:text="${book.author}">Author</td>
                        <td><span class="badge badge-success" th:text="${book.category}">Category</span></td>
                        <td th:text="${book.isbn}">ISBN</td>
                        <td th:text="${book.quantity}">5</td>
                        <td>
                            <span th:if="${book.availableQuantity > 0}" class="badge badge-success" th:text="${book.availableQuantity}">5</span>
                            <span th:if="${book.availableQuantity <= 0}" class="badge badge-danger">0</span>
                        </td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/librarian/books/edit/{id}(id=${book.id})}" class="btn btn-warning btn-sm">Edit</a>
                                <a th:href="@{/librarian/books/delete/{id}(id=${book.id})}" class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to delete this book?')">Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Pagination -->
            <div th:if="${bookPage != null and bookPage.totalPages > 1}" class="pagination mt-4 mb-4" style="display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <a th:if="${bookPage.hasPrevious()}" th:href="@{/librarian/books(page=${bookPage.number - 1})}" class="btn btn-outline btn-sm">Previous</a>
                
                <span style="display: flex; align-items: center; padding: 0 1rem;" th:text="${'Page ' + (bookPage.number + 1) + ' of ' + bookPage.totalPages}">Page 1 of 3</span>
                
                <a th:if="${bookPage.hasNext()}" th:href="@{/librarian/books(page=${bookPage.number + 1})}" class="btn btn-outline btn-sm">Next</a>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.size(books) == 0}" class="empty-state">
            <div class="empty-state-icon">📚</div>
            <h3 class="serif">No books in the library</h3>
            <p class="text-muted"><a th:href="@{/librarian/books/add}">Add your first book</a></p>
        </div>
    </div>

    <div class="footer">
        <p>Library Management System &copy; 2025 | OOAD Lab Project</p>
    </div>

</body>
</html>
