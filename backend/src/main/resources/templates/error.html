<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container-sm mt-4">
        <div class="card text-center" style="padding: 40px;">
            <h1 style="color: #d9534f; font-size: 3rem; margin-bottom: 20px;">Oops!</h1>
            <h3 th:text="${errorMessage}">An error occurred while processing your request.</h3>
            
            <p style="margin-top: 30px;">
                <a th:href="@{/}" class="btn btn-primary">Return to Home Page</a>
            </p>
        </div>
    </div>

    <div class="footer">
        <p>Library Management System &copy; 2025 | OOAD Lab Project</p>
    </div>

</body>
</html>
